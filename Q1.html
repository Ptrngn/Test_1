<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- 
            a) Use css to format a heading and paragraph about the inventor of the web, Tim Berners Lee. The text should be dark grey but not quite black.
            b) Modify the picture to be a picture of Tim Berners Lee, that is accessible to a screen reader. 
        -->
        <style>
            body {
                color: #333333;
            }
        </style>
    </head>
    <body>
        <h1>The inventor of the web</h1>
        <p>
            Sir Tim Berners Lee is a British computer scientist who invented the World Wide Web in 1989 while working as a software engineer at CERN. He was born in London in 1955. He is also a professorial research fellow at Oxford and a professor at MIT.
        </p>
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Sir_Tim_Berners-Lee_%28cropped%29.jpg">
    </body>
</html>
